wx:
  pay:
    merchant-id: 1730672512 # 替换为实际商户号
    app-id: wx33a03e8c98247aef  # 替换为实际APPID
    public_Key_id: PUB_KEY_ID_0117306725122025102700292200000400
    private-key-path: classpath:/cert/wx/apiclient_key.pem  # 私钥文件路径
    pub-key-path: classpath:/cert/wx/pub_key.pem  # 公钥文件路径
    merchant-serial-number: 66398557F3B88413DC6E4A47169F95F6D77F484B  # 证书序列号
    api-v3-key: f8e3a7b2d9c4e1f0a5b6c7d8e9f0a1b2  # APIv3密钥
    notify-url: https://dev.bole.hioas.com/api/v1/wx/pay/notify  # 回调通知地址
    return-url:    # 支付成功跳转地址
    code-expire-time: 15 # 二维码过期时间，单位：分钟，超出时间为支付自动关闭订单
ali:
  pay:
    app-id: 9021000157611719
    product-code: FACE_TO_FACE_PAYMENT
    public-key: 
    private-key: 
    cert-path: classpath:/cert/ali/appPublicCert.crt
    ali-pay-public-cert-path: classpath:/cert/ali/alipayPublicCert.crt
    root-cert-path: classpath:/cert/ali/alipayRootCert.crt
    server-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    notify-url: https://dev.bole.hioas.com/api/v1/ali/pay/notify  # 回调通知地址
    return-url:      # 支付成功跳转地址
    timeout: 15m # 二维码过期时间，单位：分钟，超出时间为支付自动关闭订单
    # 轮询配置
    polling:
      max-times: 12                # 最大轮询次数
      interval-seconds: 5          # 轮询间隔秒数
    # 沙箱环境配置
    sandbox:
      enabled: true                # 是否启用沙箱环境适配（true/false）
      initial-delay-seconds: 30     # 沙箱环境首次轮询延迟秒数（给订单创建留时间）
