server:
  undertow:
    buffer-size: 1024
    direct-buffers: true
    threads:
      io: 4
      worker: 32
  #  servlet:
  #    context-path: /${spring.application.name}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  application:
    name: dows-oss
  profiles:
    include: mysql,apidoc,mybatis,caffeine,rade,feign,oss,mineru
    active: sit

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
logging:
  level:
    root: info

wx:
  pay:
    merchant-id: 1900006XXX          # 替换为实际商户号
    app-id: wxd678efh567hg6787       # 替换为实际APPID
    private-key-path: classpath:/cert/apiclient_key.pem  # 私钥文件路径
    merchant-serial-number: 5157F09EFDC096DE15EBE81A47057A7232F1B8E1  # 证书序列号
    api-v3-key: your-api-v3-key-here  # 替换为实际APIv3密钥
    notify-url: https://your-domain.com/api/pay/notify  # 回调通知地址
    return-url: https://your-domain.com/pay/success     # 支付成功跳转地址
ali:
  pay:
    app-id: 9021000157611719
    productCode: FACE_TO_FACE_PAYMENT
    public-key:
    private-key: 
    cert-path: classpath:/cert/ali/test/appPublicCert.crt
    ali-pay-public-cert-path: classpath:/cert/ali/test/alipayPublicCert.crt
    root-cert-path: classpath:/cert/ali/test/alipayRootCert.crt
    server-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    notify-url: https://dev.bole.hioas.com/api/v1/ali/pay/notify  # 回调通知地址
    return-url: https://your-domain.com/pay/success     # 支付成功跳转地址

